schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

context: |
  Content conventions:
  - Sentence case: every sentence and every list item of prose content starts
    with a capital letter, in all three locales (e.g. journey "Quality control
    at 8 Olympic Games with OBS"). Fix it in the content YAML, never with CSS
    text-transform, so screen readers, copy-paste and search engines get the
    right text. The build enforces it for profile summary, journey text and
    experience/project descriptions (src/lib/sentence-case.ts). Exceptions:
    terminal commands and prompts ("$ cd ~/about", "./hello", "$ neofetch"),
    the hero's deliberate "Android developer" typo, and names with their own
    casing ("iOS", "gRPC", "act digital"); extend OWN_CASING_WORDS when needed.
  - Terminal-style UI text: commands and their arguments stay in English in
    every locale, like code ("$ open play-store", "$ open repo", "ls", "cd");
    the labels around them are translated: section paths ("ls ./projetos"),
    badges ("colaborador · via act digital"), status lines
    ("[construindo... ▓▓▓░░░]"). Accessible names (aria-label, alt text) are
    always fully localized. Applies to every terminal-style element, including
    future sections (terminal, contact footer).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
