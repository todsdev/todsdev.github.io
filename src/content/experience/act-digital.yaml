description:
  en: >-
    Built and maintained Globo's Android apps in Kotlin. On GloboPop, a Compose-first, modular
    app for short-form vertical video, I delivered end-to-end profile features (profile editing,
    liked content) on GraphQL APIs and personalization features in Jetpack Compose. On Premiere
    and Combate, I worked on TV-focused experiences across Android platforms, video playback and
    streaming, and the metrics and analytics behind content consumption. Active in code reviews,
    architecture discussions and technical decisions.
  pt-br: >-
    Desenvolvi e mantive apps Android da Globo em Kotlin. No GloboPop, um app modular e
    Compose-first de vídeos verticais curtos, entreguei funcionalidades de perfil de ponta a ponta
    (edição de perfil, conteúdos curtidos) com APIs GraphQL e recursos de personalização em
    Jetpack Compose. No Premiere e no Combate, trabalhei em experiências para TV em diferentes
