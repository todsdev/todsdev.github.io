description:
  en: >-
    Event-based freelance work in an international, English-first broadcasting environment at
    eight Olympic Games. Progressed from logging live competition footage to quality control,
    and coordinated a quality control team working with international crews to keep broadcast
    standards during live events.
  pt-br: >-
    Trabalho freelance por evento em um ambiente internacional de transmissão, com o inglês como
    língua de trabalho, em oito edições dos Jogos Olímpicos. Comecei registrando imagens de
    competições ao vivo, passei ao controle de qualidade e coordenei uma equipe de QC junto a
    times internacionais para manter o padrão das transmissões ao vivo.
  es: >-
    Trabajo freelance por evento en un entorno internacional de transmisión, con el inglés como
    idioma de trabajo, en ocho ediciones de los Juegos Olímpicos. Empecé registrando imágenes de
    competiciones en vivo, pasé al control de calidad y coordiné un equipo de QC junto a equipos
    internacionales para mantener el estándar de las transmisiones en vivo.
